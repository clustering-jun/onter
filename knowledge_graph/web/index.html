<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온터 · 연결에서 발견하는 복지</title><link rel="stylesheet" href="style.css?v=3"><script src="vendor/cytoscape.min.js"></script></head>
<body>
<header class="topbar"><a href="#" id="brand" aria-label="온터 시작 화면"><span class="brand-icon">온</span><strong>온터</strong><span class="brand-tag">복지의 연결을 발견하다</span></a><button class="search-trigger" id="openSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><span>프로그램, 단지, 사례 검색</span><kbd>/</kbd></button><button class="top-home" id="home">전체 프로그램</button></header>
<div class="app-shell">
<nav class="rail" aria-label="탐색 메뉴"><button class="rail-item active" data-nav="overview" title="프로그램 지도"><span>◉</span><small>지도</small></button><button class="rail-item" data-nav="complex" title="단지 검색"><span>▥</span><small>단지</small></button><button class="rail-item" data-nav="card" title="실행 사례 검색"><span>▤</span><small>사례</small></button><div class="rail-line"></div><button class="rail-item" data-nav="news" title="현장 소식 검색"><span>◷</span><small>소식</small></button></nav>
<main class="workspace">
<section class="graph-stage" aria-label="지식 지도">
<div class="map-heading"><div class="breadcrumb"><button id="back" aria-label="이전 지도">←</button><span id="mapCategory">프로그램 지도</span></div><h1 id="graphTitle">어떤 연결을 발견할까요?</h1><p id="graphSubtitle">프로그램을 선택해 실제 사례를 살펴보세요.</p></div>
<div id="cy" aria-label="노드를 클릭하거나 끌어 탐색하는 지도"></div><div id="labels" aria-label="지도에 표시된 대상"></div>
<div class="map-legend" id="legend"></div>
<div class="map-status"><span class="live-dot"></span><span id="graphCount"></span></div>
<div class="zoom-controls"><button id="zoomOut" aria-label="축소">−</button><output id="zoomLevel">100%</output><button id="zoomIn" aria-label="확대">+</button><span></span><button id="fit" title="전체 노드 보기" aria-label="전체 노드 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></div>
<div class="gesture-hint">드래그로 연결을 움직이고 · 휠로 가까이 보기</div>
<div id="loading" hidden><span class="spinner"></span>연결을 불러오는 중</div>
<div id="hoverName" hidden></div>
<div class="start-cards" id="startCards"><span>이런 이야기부터</span><button data-focus="case:CB01"><b>숙골빨래터</b><small>주민의 빨래 고민에서 시작된 변화 ↗</small></button><button data-focus="program:H03"><b>원예·텃밭</b><small>함께 가꾸는 일상과 관계 ↗</small></button></div>
</section>
<aside class="inspector" id="inspector" aria-label="선택한 대상 상세" hidden><div class="inspector-bar"><span id="selectionType"></span><button id="closeDetail" aria-label="상세 닫기">×</button></div><div id="detail"></div></aside>
</main></div>
<dialog id="searchDialog"><div class="search-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input id="search" placeholder="찾고 싶은 프로그램이나 단지 이름" aria-label="검색어" autocomplete="off"><button id="closeSearch" aria-label="검색 닫기">×</button></div><div class="search-kinds"><button data-kind="" class="active">전체</button><button data-kind="program">프로그램</button><button data-kind="complex">단지</button><button data-kind="card">사례</button><button data-kind="news">소식</button></div><div id="searchResults"></div></dialog>
<div id="toast" role="status" hidden></div><script src="details.js?v=3"></script><script src="app.js?v=3"></script></body></html>
